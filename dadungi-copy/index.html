  <style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#172d21;background:#f5f8f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#e7f0e5 0,transparent 60%),#f5f8f4}main{width:min(100% - 32px,480px);margin:auto;padding:48px 0 28px}.brand{display:flex;align-items:center;gap:9px;margin:0 4px 24px;font-size:14px;font-weight:700;letter-spacing:.02em;color:#346044}.brand-dot{height:9px;width:9px;background:#267747;border-radius:50%}.card{padding:34px 30px 24px;border:1px solid #dce5da;border-radius:26px;background:white;box-shadow:0 12px 42px #254c2e08;text-align:center}.copy-symbol{display:flex;align-items:center;justify-content:center;background:#edf5eb;color:#247241;width:64px;height:64px;border-radius:19px;margin:0 auto 26px}.copy-symbol svg{width:31px;height:31px}.eyebrow{margin:0 0 9px;color:#56705e;font-size:13px;font-weight:600}h1{font-size:28px;letter-spacing:-1px;line-height:1.4;margin:0 0 10px}.intro{font-size:14px;line-height:1.6;color:#657268;margin:0}.number-wrap{margin:30px 0 20px;padding:24px 10px 20px;border:1px solid #e0e8de;border-radius:16px;background:#f8faf7}.number-wrap label{display:block;font-size:12px;letter-spacing:.02em;color:#667c69;margin-bottom:10px}input{display:block;border:0;background:transparent;width:100%;padding:0;text-align:center;color:#193d26;font-family:inherit;font-size:clamp(24px,7vw,33px);font-weight:700;letter-spacing:.02em;line-height:1.3;border-radius:6px;user-select:text;-webkit-user-select:text;cursor:text}input:focus-visible{outline:2px solid #267747;outline-offset:4px}#number-note{font-size:12px;color:#6b7c6e;margin:12px 0 0}button{width:100%;min-height:60px;display:flex;gap:11px;align-items:center;justify-content:center;border:0;border-radius:14px;background:#166534;color:white;font-family:inherit;font-size:18px;font-weight:700;line-height:1.4;cursor:pointer;transition:background .15s,transform .15s}button svg{height:22px;width:22px}button:hover{background:#11532a}button:active{transform:scale(.985)}button:focus-visible{outline:3px solid #84be8f;outline-offset:4px}.status{white-space:pre-line;min-height:43px;margin:17px 0 0;font-size:13px;line-height:1.65;color:#657268}.status.success{color:#166534;font-weight:700}.status.error{color:#8b3e20}#manual{margin:8px 0 0;padding:13px;border-radius:10px;background:#fff5e7;color:#76512b;font-size:13px;line-height:1.7}.footer{margin:23px 0 0;text-align:center;color:#768279;font-size:12px}@media(max-width:360px){main{padding-top:26px;width:calc(100% - 24px)}.card{padding:28px 19px 20px}h1{font-size:25px}.intro{font-size:13px}.number-wrap{padding-left:5px;padding-right:5px}}@media(prefers-reduced-motion:reduce){button{transition:none}}

<body>
  <main>
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span> 간편 숫자 복사</div>
    <section class="card" aria-labelledby="title">
      <div class="copy-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="11" y="11" width="16" height="17" rx="3" stroke="currentColor" stroke-width="2"/><path d="M7 22H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h13a3 3 0 0 1 3 3v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <p class="eyebrow">버튼 한 번으로 간편하게</p>
      <h1 id="title">숫자를 복사하세요</h1>
      <p class="intro">아래 버튼을 누르면 숫자가 복사됩니다.</p>
      <div class="number-wrap">
        <label for="number">복사할 숫자</label>
        <input id="number" type="text" value="3333138409084" readonly inputmode="none" spellcheck="false" autocomplete="off" aria-describedby="number-note">
        <p id="number-note">공백 없이 13자리</p>
      </div>
      <button id="copy" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 16H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span id="button-label">숫자 복사</span></button>
      <p id="status" class="status" role="status" aria-live="polite">복사 후 필요한 곳에 붙여넣으세요.</p>
      <p id="manual" hidden>복사가 제한된 경우 위 숫자를 길게 눌러 선택한 뒤 <strong>복사</strong>를 누르세요.</p>
    </section>
    <p class="footer">QR로 열고, 버튼으로 복사하세요.</p>
  </main>
<script>
'use strict';
const NUMBER = '3333138409084';
const field = document.getElementById('number');
const button = document.getElementById('copy');
const label = document.getElementById('button-label');
const status = document.getElementById('status');
const manual = document.getElementById('manual');

function legacyCopy() {
  const previousFocus = document.activeElement;
  field.focus({preventScroll:true});
  field.select();
  field.setSelectionRange(0, NUMBER.length);
  let copied = false;
  try { copied = document.execCommand('copy'); } catch (_) {}
  if (copied && previousFocus) previousFocus.focus({preventScroll:true});
  return copied;
}

button.addEventListener('click', async () => {
  let copied = false;
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(NUMBER);
      copied = true;
    } catch (_) { copied = legacyCopy(); }
  } else {
    copied = legacyCopy();
  }
  if (copied) {
    label.textContent = '복사 완료 · 다시 복사';
    status.textContent = '3333138409084가 복사되었습니다.\n필요한 곳에 붙여넣으세요.';
    status.className = 'status success';
    manual.hidden = true;
  } else {
    label.textContent = '다시 복사 시도';
    status.textContent = '자동 복사가 제한되어 있습니다.';
    status.className = 'status error';
    manual.hidden = false;
  }
});

</script>
