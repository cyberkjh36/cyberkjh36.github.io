<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#104838">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <title>계좌번호 복사 · 느티나무 노래방 &amp; HOF</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 1rem;
      background: #edf3ef; color: #102f27;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }
    main {
      width: min(100%, 27rem); overflow: hidden;
      background: white; border: 1px solid #cddbd2;
      border-radius: 1.35rem; box-shadow: 0 1rem 3rem #153e2410;
    }
    header { background: #104838; color: white; padding: 1.25rem clamp(1rem, 6vw, 2rem); font-weight: 650; }
    header span { border-inline-start: .23rem solid #f1ca69; padding-inline-start: .65rem; }
    section { padding: clamp(1rem, 6vw, 2rem); }
    h1 { margin: 0 0 1.7rem; font-size: 1.85rem; letter-spacing: -.05em; }
    label { display: block; color: #486357; font-size: 1rem; font-weight: 650; }
    input {
      display: block; width: 100%; margin: .35rem 0 1.7rem;
      padding: .15rem 0; border: 0; border-radius: 0;
      background: transparent; color: #102f27; font: 700 clamp(1.45rem, 7.4vw, 2rem)/1.35 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    button {
      width: 100%; min-height: 3.7rem; padding: .8rem; border: 0;
      border-radius: .8rem; background: #105c43; color: white;
      font: inherit; font-size: 1.2rem; font-weight: 700; cursor: pointer;
    }
    button:active { background: #0a4935; }
    :focus-visible { outline: 3px solid #a9740b; outline-offset: 3px; }
    p { min-height: 3em; margin: .85rem 0 0; line-height: 1.5; color: #455c51; }
    p[data-copied] { color: #0a5c3a; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <header><span>느티나무 노래방 &amp; HOF</span></header>
    <section aria-labelledby="title">
      <h1 id="title">계좌이체</h1>
      <label for="account">농협 계좌번호</label>
      <input id="account" value="3516554362873" readonly inputmode="none" spellcheck="false">
      <button id="copy" type="button" hidden>계좌번호 복사</button>
      <p id="status" role="status">계좌번호를 길게 눌러 복사해 주세요.</p>
    </section>
  </main>
  <script>
    const account = document.getElementById('account');
    const button = document.getElementById('copy');
    const status = document.getElementById('status');
    const tapHint = '위 버튼을 눌러 계좌번호를 복사해 주세요.';
    let manualAttempt = 0;

    function showCopied() {
      status.dataset.copied = '';
      status.textContent = '복사되었습니다. 은행 앱에 붙여넣으세요.';
    }

    async function tryAutoCopy() {
      if (!navigator.clipboard || document.visibilityState !== 'visible' || manualAttempt) return;
      try {
        await navigator.clipboard.writeText(account.value);
        if (!manualAttempt) showCopied();
      } catch {
        // Some browsers allow writing only inside a tap handler.
      }
    }

    button.hidden = false;
    status.textContent = tapHint;
    button.addEventListener('click', async () => {
      const attempt = ++manualAttempt;
      try {
        await navigator.clipboard.writeText(account.value);
        if (attempt === manualAttempt) showCopied();
      } catch {
        if (attempt !== manualAttempt) return;
        account.focus();
        account.select();
        account.setSelectionRange(0, account.value.length);
        try {
          if (document.execCommand('copy')) {
            showCopied();
            return;
          }
        } catch {
          // Keep the number selected for the system copy menu.
        }
        delete status.dataset.copied;
        status.textContent = '계좌번호를 길게 누른 뒤 ‘복사’를 선택해 주세요.';
      }
    });
    window.addEventListener('pageshow', tryAutoCopy, { once: true });
  </script>
</body>
</html>
